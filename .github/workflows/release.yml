name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version label"
        required: false
        default: "manual"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: python -m pip install -e ".[dev]"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run backend tests
        run: python -m pytest tests -q

      - name: Run frontend tests
        working-directory: frontend
        run: npm run test -- --run

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Validate production Compose
        run: |
          export VANTAGE_AGENT_SHARED_TOKEN=release-placeholder-token
          docker compose -f docker-compose.prod.yml config --quiet

      - name: Build release bundle
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          if ("${{ github.event_name }}" -eq "workflow_dispatch" -and "${{ inputs.version }}") {
            $version = "${{ inputs.version }}"
          }
          ./scripts/build-release.ps1 -Version $version

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vantage-release-bundle
          path: |
            dist/releases/*.zip
            dist/releases/SHA256SUMS.txt

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/releases/*.zip
            dist/releases/SHA256SUMS.txt
