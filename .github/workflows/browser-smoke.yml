name: Browser smoke

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-local:
    runs-on: ubuntu-latest
    env:
      VANTAGE_AGENT_SHARED_TOKEN: ci-agent-token-000000000000000000000000
      VANTAGE_CONTROL_PLANE_TOKEN: ci-control-token-0000000000000000000000
      VANTAGE_SESSION_SIGNING_KEY: ci-session-key-00000000000000000000000
      VANTAGE_AUDIT_SIGNING_KEY: ci-audit-key-000000000000000000000000
      VANTAGE_DEMO_MODE: "0"
      # The development stack bind-mounts the checkout over /app, which the backend's non-root
      # user cannot write on a Linux runner. Keep the smoke-test database inside the container.
      VANTAGE_DATABASE_URL: sqlite+pysqlite:////tmp/vantage.sqlite3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Start Vantage
        run: docker compose up --build -d
      - name: Wait for readiness
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8000/api/health/ready > /dev/null \
              && curl --fail --silent http://127.0.0.1:5173/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs
          exit 1
      - name: Run authenticated desktop smoke test
        working-directory: frontend
        run: npm run test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: frontend/playwright-report
          if-no-files-found: ignore
          retention-days: 14
      - name: Show container logs after failure
        if: failure()
        run: docker compose logs
      - name: Stop Vantage
        if: always()
        run: docker compose down --volumes
