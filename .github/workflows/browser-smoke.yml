name: Browser smoke

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-local:
    runs-on: ubuntu-latest
    env:
      VANTAGE_AGENT_SHARED_TOKEN: ci-agent-token-000000000000000000000000
      VANTAGE_CONTROL_PLANE_TOKEN: ci-control-token-0000000000000000000000
      VANTAGE_SESSION_SIGNING_KEY: ci-session-key-00000000000000000000000
      VANTAGE_AUDIT_SIGNING_KEY: ci-audit-key-000000000000000000000000
      VANTAGE_DEMO_MODE: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Start Vantage
        run: docker compose up --build -d
      - name: Wait for readiness
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8000/api/health/ready > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs
          exit 1
      - name: Run authenticated desktop smoke test
        working-directory: frontend
        run: npm run test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          if-no-files-found: ignore
          retention-days: 14
      - name: Show container logs after failure
        if: failure()
        run: docker compose logs
      - name: Stop Vantage
        if: always()
        run: docker compose down --volumes
