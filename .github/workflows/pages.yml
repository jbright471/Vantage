name: Publish Docs Site

on:
  push:
    branches: [master, main]
    paths:
      - "docs/product/**"
      - "docs/screenshots/**"
      - "README.md"
      - "ROADMAP.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare static docs artifact
        run: |
          mkdir -p public
          cp -R docs/product/* public/
          mkdir -p public/screenshots
          cp -R docs/screenshots/* public/screenshots/ || true
          cp README.md public/README.md
          cp ROADMAP.md public/ROADMAP.md
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
