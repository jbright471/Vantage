app_name = "Vantage"
poll_interval_seconds = 5
stale_after_seconds = 15
unreachable_after_seconds = 30
snapshot_retention_hours = 24
snapshot_max_per_node = 5000
snapshot_min_per_node = 1
snapshot_prune_interval_seconds = 900
run_timeout_seconds = 300
abandoned_after_seconds = 900
idempotency_dedupe_seconds = 30
agent_auth_token_env = "VANTAGE_AGENT_SHARED_TOKEN"
local_ollama_base_urls = ["http://127.0.0.1:11434"]

[[nodes]]
node_id = "control-plane"
display_name = "Control Plane"
base_url = "http://127.0.0.1:8000"
role = "primary"
enabled = true

[[nodes]]
node_id = "remote-worker"
display_name = "Remote Worker"
base_url = "http://10.0.0.25:9110"
role = "remote"
enabled = false
