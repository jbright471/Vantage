abandoned_after_seconds = 900
idempotency_dedupe_seconds = 30
agent_auth_token_env = "VANTAGE_AGENT_SHARED_TOKEN"
local_ollama_base_urls = ["http://127.0.0.1:11434", "http://127.0.0.1:11435"]

