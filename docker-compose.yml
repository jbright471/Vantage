services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: vantage-backend
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      WATCHFILES_FORCE_POLLING: "true"
      VANTAGE_LOCAL_OLLAMA_BASE_URLS: "http://host.docker.internal:11434,http://host.docker.internal:11435"
      VANTAGE_AGENT_SHARED_TOKEN: "${VANTAGE_AGENT_SHARED_TOKEN:-}"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vantage-frontend
    depends_on:
      - backend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - vantage_frontend_node_modules:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VANTAGE_API_PROXY_TARGET: "http://backend:8000"

volumes:
  vantage_frontend_node_modules:
