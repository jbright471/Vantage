services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: vantage-backend
    ports:
      - "${VANTAGE_BIND_ADDRESS:-127.0.0.1}:8000:8000"
    volumes:
      - .:/app
    environment:
      WATCHFILES_FORCE_POLLING: "true"
      VANTAGE_BOOTSTRAP_CONFIG_PATH: "${VANTAGE_BOOTSTRAP_CONFIG_PATH:-/app/config/vantage.bootstrap.toml}"
      VANTAGE_LOCAL_OLLAMA_BASE_URLS: "http://host.docker.internal:11400"
      VANTAGE_AGENT_SHARED_TOKEN: "${VANTAGE_AGENT_SHARED_TOKEN:-}"
      VANTAGE_AGENT_AUTH_MODE: "${VANTAGE_AGENT_AUTH_MODE:-hmac}"
      VANTAGE_AGENT_KEY_ID: "${VANTAGE_AGENT_KEY_ID:-}"
      VANTAGE_AUDIT_SIGNING_KEY: "${VANTAGE_AUDIT_SIGNING_KEY:-}"
      VANTAGE_AUDIT_KEY_ID: "${VANTAGE_AUDIT_KEY_ID:-local-audit-key}"
      VANTAGE_EXTERNAL_API_TOKEN: "${VANTAGE_EXTERNAL_API_TOKEN:-}"
      VANTAGE_CONTROL_PLANE_TOKEN: "${VANTAGE_CONTROL_PLANE_TOKEN:-}"
      VANTAGE_SESSION_SIGNING_KEY: "${VANTAGE_SESSION_SIGNING_KEY:-}"
      VANTAGE_SESSION_MAX_AGE_SECONDS: "${VANTAGE_SESSION_MAX_AGE_SECONDS:-28800}"
      VANTAGE_SESSION_COOKIE_SECURE: "${VANTAGE_SESSION_COOKIE_SECURE:-0}"
      VANTAGE_LLM_REQUESTS_PER_MINUTE: "${VANTAGE_LLM_REQUESTS_PER_MINUTE:-12}"
      VANTAGE_LLM_MAX_CONCURRENCY: "${VANTAGE_LLM_MAX_CONCURRENCY:-2}"
      VANTAGE_EVAL_NUM_PREDICT: "${VANTAGE_EVAL_NUM_PREDICT:-512}"
      VANTAGE_LLM_MAX_RESPONSE_CHARS: "${VANTAGE_LLM_MAX_RESPONSE_CHARS:-65536}"
      VANTAGE_WEBHOOK_URL: "${VANTAGE_WEBHOOK_URL:-}"
      VANTAGE_SLACK_WEBHOOK_URL: "${VANTAGE_SLACK_WEBHOOK_URL:-}"
      VANTAGE_DISCORD_WEBHOOK_URL: "${VANTAGE_DISCORD_WEBHOOK_URL:-}"
      VANTAGE_WEBHOOK_ALLOWED_HOSTS: "${VANTAGE_WEBHOOK_ALLOWED_HOSTS:-}"
      VANTAGE_WEBHOOK_ALLOW_PRIVATE_NETWORKS: "${VANTAGE_WEBHOOK_ALLOW_PRIVATE_NETWORKS:-0}"
      VANTAGE_EMAIL_SMTP_HOST: "${VANTAGE_EMAIL_SMTP_HOST:-}"
      VANTAGE_EMAIL_SMTP_PORT: "${VANTAGE_EMAIL_SMTP_PORT:-587}"
      VANTAGE_EMAIL_SMTP_USERNAME: "${VANTAGE_EMAIL_SMTP_USERNAME:-}"
      VANTAGE_EMAIL_SMTP_PASSWORD: "${VANTAGE_EMAIL_SMTP_PASSWORD:-}"
      VANTAGE_EMAIL_FROM: "${VANTAGE_EMAIL_FROM:-}"
      VANTAGE_EMAIL_TO: "${VANTAGE_EMAIL_TO:-}"
      VANTAGE_EMAIL_USE_TLS: "${VANTAGE_EMAIL_USE_TLS:-1}"
      VANTAGE_REPORT_SCHEDULE_ENABLED: "${VANTAGE_REPORT_SCHEDULE_ENABLED:-0}"
      VANTAGE_REPORT_OUTPUT_DIR: "${VANTAGE_REPORT_OUTPUT_DIR:-reports}"
      VANTAGE_DEMO_MODE: "${VANTAGE_DEMO_MODE:-0}"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vantage-frontend
    depends_on:
      - backend
    ports:
      - "${VANTAGE_BIND_ADDRESS:-127.0.0.1}:5173:5173"
    volumes:
      - ./frontend:/app
      - vantage_frontend_node_modules:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VANTAGE_API_PROXY_TARGET: "http://backend:8000"

volumes:
  vantage_frontend_node_modules:
