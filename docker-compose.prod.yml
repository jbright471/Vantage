services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend.prod
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - vantage_data:/data
    environment:
      VANTAGE_DATABASE_URL: "${VANTAGE_DATABASE_URL:-sqlite+pysqlite:////data/vantage.sqlite3}"
      VANTAGE_LOCAL_OLLAMA_BASE_URLS: "${VANTAGE_LOCAL_OLLAMA_BASE_URLS:-http://host.docker.internal:11434}"
      VANTAGE_AGENT_SHARED_TOKEN: "${VANTAGE_AGENT_SHARED_TOKEN:?Set VANTAGE_AGENT_SHARED_TOKEN before starting production compose}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready', timeout=5).read()",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  vantage_data:
