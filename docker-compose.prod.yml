services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend.prod
    restart: unless-stopped
    volumes:
      - vantage_data:/data
    environment:
      VANTAGE_DATABASE_URL: "${VANTAGE_DATABASE_URL:-sqlite+pysqlite:////data/vantage.sqlite3}"
      VANTAGE_LOCAL_OLLAMA_BASE_URLS: "${VANTAGE_LOCAL_OLLAMA_BASE_URLS:-http://host.docker.internal:11400}"
      VANTAGE_AGENT_SHARED_TOKEN: "${VANTAGE_AGENT_SHARED_TOKEN:?Set VANTAGE_AGENT_SHARED_TOKEN before starting production compose}"
      VANTAGE_AGENT_AUTH_MODE: "${VANTAGE_AGENT_AUTH_MODE:-hmac}"
      VANTAGE_AGENT_KEY_ID: "${VANTAGE_AGENT_KEY_ID:-}"
      VANTAGE_AUDIT_SIGNING_KEY: "${VANTAGE_AUDIT_SIGNING_KEY:-}"
      VANTAGE_AUDIT_KEY_ID: "${VANTAGE_AUDIT_KEY_ID:-production-audit-key}"
      VANTAGE_EXTERNAL_API_TOKEN: "${VANTAGE_EXTERNAL_API_TOKEN:-}"
      VANTAGE_CONTROL_PLANE_TOKEN: "${VANTAGE_CONTROL_PLANE_TOKEN:?Set VANTAGE_CONTROL_PLANE_TOKEN before starting production compose}"
      VANTAGE_SESSION_SIGNING_KEY: "${VANTAGE_SESSION_SIGNING_KEY:?Set VANTAGE_SESSION_SIGNING_KEY before starting production compose}"
      VANTAGE_SESSION_MAX_AGE_SECONDS: "${VANTAGE_SESSION_MAX_AGE_SECONDS:-28800}"
      VANTAGE_SESSION_COOKIE_SECURE: "${VANTAGE_SESSION_COOKIE_SECURE:-0}"
      VANTAGE_LLM_REQUESTS_PER_MINUTE: "${VANTAGE_LLM_REQUESTS_PER_MINUTE:-12}"
      VANTAGE_LLM_MAX_CONCURRENCY: "${VANTAGE_LLM_MAX_CONCURRENCY:-2}"
      VANTAGE_EVAL_NUM_PREDICT: "${VANTAGE_EVAL_NUM_PREDICT:-512}"
      VANTAGE_LLM_MAX_RESPONSE_CHARS: "${VANTAGE_LLM_MAX_RESPONSE_CHARS:-65536}"
      VANTAGE_WEBHOOK_URL: "${VANTAGE_WEBHOOK_URL:-}"
      VANTAGE_SLACK_WEBHOOK_URL: "${VANTAGE_SLACK_WEBHOOK_URL:-}"
      VANTAGE_DISCORD_WEBHOOK_URL: "${VANTAGE_DISCORD_WEBHOOK_URL:-}"
      VANTAGE_WEBHOOK_ALLOWED_HOSTS: "${VANTAGE_WEBHOOK_ALLOWED_HOSTS:-}"
      VANTAGE_WEBHOOK_ALLOW_PRIVATE_NETWORKS: "${VANTAGE_WEBHOOK_ALLOW_PRIVATE_NETWORKS:-0}"
      VANTAGE_EMAIL_SMTP_HOST: "${VANTAGE_EMAIL_SMTP_HOST:-}"
      VANTAGE_EMAIL_SMTP_PORT: "${VANTAGE_EMAIL_SMTP_PORT:-587}"
      VANTAGE_EMAIL_SMTP_USERNAME: "${VANTAGE_EMAIL_SMTP_USERNAME:-}"
      VANTAGE_EMAIL_SMTP_PASSWORD: "${VANTAGE_EMAIL_SMTP_PASSWORD:-}"
      VANTAGE_EMAIL_FROM: "${VANTAGE_EMAIL_FROM:-}"
      VANTAGE_EMAIL_TO: "${VANTAGE_EMAIL_TO:-}"
      VANTAGE_EMAIL_USE_TLS: "${VANTAGE_EMAIL_USE_TLS:-1}"
      VANTAGE_REPORT_SCHEDULE_ENABLED: "${VANTAGE_REPORT_SCHEDULE_ENABLED:-0}"
      VANTAGE_REPORT_OUTPUT_DIR: "${VANTAGE_REPORT_OUTPUT_DIR:-/data/reports}"
      VANTAGE_DEMO_MODE: "${VANTAGE_DEMO_MODE:-0}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready', timeout=5).read()",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${VANTAGE_BIND_ADDRESS:-127.0.0.1}:5173:8080"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/cache/nginx:size=16m,mode=1777
      - /var/run:size=1m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  vantage_data:
