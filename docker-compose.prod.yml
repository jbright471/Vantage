services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend.prod
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - vantage_data:/data
    environment:
      VANTAGE_DATABASE_URL: "${VANTAGE_DATABASE_URL:-sqlite+pysqlite:////data/vantage.sqlite3}"
      VANTAGE_LOCAL_OLLAMA_BASE_URLS: "${VANTAGE_LOCAL_OLLAMA_BASE_URLS:-http://host.docker.internal:11434}"
      VANTAGE_AGENT_SHARED_TOKEN: "${VANTAGE_AGENT_SHARED_TOKEN:?Set VANTAGE_AGENT_SHARED_TOKEN before starting production compose}"
      VANTAGE_AGENT_AUTH_MODE: "${VANTAGE_AGENT_AUTH_MODE:-bearer}"
      VANTAGE_AGENT_KEY_ID: "${VANTAGE_AGENT_KEY_ID:-}"
      VANTAGE_AUDIT_SIGNING_KEY: "${VANTAGE_AUDIT_SIGNING_KEY:-}"
      VANTAGE_AUDIT_KEY_ID: "${VANTAGE_AUDIT_KEY_ID:-production-audit-key}"
      VANTAGE_EXTERNAL_API_TOKEN: "${VANTAGE_EXTERNAL_API_TOKEN:-}"
      VANTAGE_WEBHOOK_URL: "${VANTAGE_WEBHOOK_URL:-}"
      VANTAGE_SLACK_WEBHOOK_URL: "${VANTAGE_SLACK_WEBHOOK_URL:-}"
      VANTAGE_DISCORD_WEBHOOK_URL: "${VANTAGE_DISCORD_WEBHOOK_URL:-}"
      VANTAGE_WEBHOOK_ALLOWED_HOSTS: "${VANTAGE_WEBHOOK_ALLOWED_HOSTS:-}"
      VANTAGE_EMAIL_SMTP_HOST: "${VANTAGE_EMAIL_SMTP_HOST:-}"
      VANTAGE_EMAIL_SMTP_PORT: "${VANTAGE_EMAIL_SMTP_PORT:-587}"
      VANTAGE_EMAIL_SMTP_USERNAME: "${VANTAGE_EMAIL_SMTP_USERNAME:-}"
      VANTAGE_EMAIL_SMTP_PASSWORD: "${VANTAGE_EMAIL_SMTP_PASSWORD:-}"
      VANTAGE_EMAIL_FROM: "${VANTAGE_EMAIL_FROM:-}"
      VANTAGE_EMAIL_TO: "${VANTAGE_EMAIL_TO:-}"
      VANTAGE_EMAIL_USE_TLS: "${VANTAGE_EMAIL_USE_TLS:-1}"
      VANTAGE_REPORT_SCHEDULE_ENABLED: "${VANTAGE_REPORT_SCHEDULE_ENABLED:-0}"
      VANTAGE_REPORT_OUTPUT_DIR: "${VANTAGE_REPORT_OUTPUT_DIR:-/data/reports}"
      VANTAGE_DEMO_MODE: "${VANTAGE_DEMO_MODE:-0}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready', timeout=5).read()",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  vantage_data:
